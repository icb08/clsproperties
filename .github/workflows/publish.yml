name: Publish Python Package to PyPi on Release

# Executes workflow when a release is published.
on:
  release:
    types: [published]

jobs:

  # First job sets up a linux machine to build the .tar.gz and .whl python package files.
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Repository Content to Machine
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Build Package
        run: python -m pip install --upgrade build

      - name: Build Package
        run: python -m build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: dist/

  # Second job sets up a linux machine to download the package files (artifacts) and upload to PyPi.
  publish:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
