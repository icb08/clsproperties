[project]
name = "clsproperties"
authors = [{name = "Isaac Bell"}]
dynamic = ["version"]
description = "This library provides classproperty objects for controlled access to class attributes."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "python",
    "python3",
    "python-3",
    "lib",
    "library",
    "python-lib",
    "python-library",
    "package",
    "python-package",
    "module",
    "python-module",
    "pypi",
    "pypi-libary",
    "pypi-package",
    "class",
    "classes",
    "metaclass",
    "metaclasses",
    "attribute",
    "attributes",
    "classattribute",
    "classattributes",
    "class-attribute",
    "class-attributes",
    "property",
    "properties",
    "classproperty",
    "classproperties",
    "class-property",
    "class-properties",
    "descriptor",
    "descriptors",
    "getter",
    "getters",
    "getter-function",
    "getter-functions",
    "getter-method",
    "getter-methods",
    "setter",
    "setters",
    "setter-function",
    "setter-functions",
    "setter-method",
    "setter-methods",
    "deleter",
    "deleters",
    "deleter-function",
    "deleter-functions",
    "deleter-method",
    "deleter-methods",
    "getter-setter-deleter",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://icb08.github.io/clsproperties/"
Repository = "https://github.com/icb08/clsproperties"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/clsproperties/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["/.github"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "mkdocs>=1.6.1",
    "mike>=2.2.0",
    "mkdocs-git-revision-date-localized-plugin>=1.6.2",
    "mkdocs-github-admonitions-plugin>=0.1.1",
    "mkdocs-include-markdown-plugin>=7.3.0",
    "mkdocs-material>=9.8.0",
]